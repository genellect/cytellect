# Docker Desktop: private Linux volume, loopback-only browser/API access.
name: cytellect-human-e2e
services:
  data-init:
    image: cytellect-human-e2e-api
    build:
      context: .
      dockerfile: infra/Dockerfile.python
      target: api
    user: "0:0"
    entrypoint: ["python", "-c"]
    command:
      - "import os; from pathlib import Path; p=Path('/data'); assert p.stat().st_uid in (0,10001), 'Unexpected volume owner'; p.chmod(0o700); os.chown(p,10001,10001)"
    volumes: ["research:/data"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  api:
    environment:
      CYTELLECT_APP_ORIGIN: http://127.0.0.1:3087
      CYTELLECT_DESKTOP_OWNER: "true"
    networks: [edge, private]
    volumes: !override
      - research:/data
    ports: !override
      - "127.0.0.1:8001:8000"
    depends_on:
      data-init: {condition: service_completed_successfully}
  worker:
    volumes: !override
      - research:/data
  web:
    build:
      args:
        NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:8001
        NEXT_PUBLIC_CYTELLECT_DESKTOP_OWNER: "true"
    ports: !override
      - "127.0.0.1:3087:3000"
volumes:
  research:
