[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cytellect"
version = "0.1.0"
description = "Reproducible, private immunofluorescence analysis"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "numpy>=2.2,<3",
  "tifffile>=2025.3",
  "scikit-image>=0.25,<1",
  "pillow>=11,<13",
  "pandas>=2.2,<3",
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.10,<4",
  "roifile>=2025.2",
  "defusedxml>=0.7,<1",
  "psutil>=7,<8",
  "imagecodecs>=2026.1",
]

[project.scripts]
cytellect = "cytellect_api.cli:main"
cytellect-worker = "cytellect_worker.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["packages/analysis/src/cytellect_analysis", "services/api/src/cytellect_api", "services/worker/src/cytellect_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fiji: requires the locked Fiji runtime"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
