name: Prepare Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Unique prerelease version, for example 0.1.0-local.2"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CYTELLECT_TEST_LOCAL: "1"
      CYTELLECT_WEB_URL: http://127.0.0.1:8765
      CYTELLECT_TEST_API_ORIGIN: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - name: Require successful checks on this exact main commit
        uses: actions/github-script@v7
        with:
          script: |
            if (!/^\d+\.\d+\.\d+-local\.\d+$/.test(process.env.RELEASE_VERSION)) {
              throw new Error('Expected a unique local prerelease version');
            }
            const tag = `v${process.env.RELEASE_VERSION}`;
            for (const lookup of [
              () => github.rest.git.getRef({...context.repo, ref: `tags/${tag}`}),
              () => github.rest.repos.getReleaseByTag({...context.repo, tag})
            ]) {
              try { await lookup(); throw new Error('Release version already exists'); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref: context.sha, filter: 'latest', per_page: 100
            });
            for (const name of ['python', 'web', 'fiji-browser', 'local-windows', 'python-windows-314']) {
              const check = checks.find(c => c.name === name && c.app?.slug === 'github-actions');
              if (check?.conclusion !== 'success') throw new Error(`${name} has not passed on this commit`);
            }
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --group build
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node apps/web/node_modules/@playwright/test/cli.js install chromium
      - name: Build immutable source and static UI package
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $archive = Join-Path $releaseDir "Cytellect-$env:RELEASE_VERSION-windows-x64.zip"
          $inputs = Join-Path $env:RUNNER_TEMP 'release-inputs'
          New-Item -ItemType Directory -Path $inputs | Out-Null
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          $data = Join-Path $inputs 'windows-tcltk-9.0.4-data.zip'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare_windows_runtime_data.ps1 -Python $python -CacheRoot (Join-Path $inputs 'cache') -ScratchRoot (Join-Path $inputs 'extraction') -Output $data
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime data preparation failed' }
          & $python -B -m hatchling build -t wheel -d (Join-Path $inputs 'wheels')
          if ($LASTEXITCODE -ne 0) { throw 'Normal locked wheel build failed' }
          $requirements = Join-Path $inputs 'requirements.txt'
          uv export --locked --no-dev --no-emit-project --no-header --output-file $requirements | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Hashed production dependency export failed' }
          $wheels = @(Get-ChildItem -LiteralPath (Join-Path $inputs 'wheels') -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected one project wheel' }
          & $python -B scripts/build_local_bundle.py --version $env:RELEASE_VERSION --output $archive --runtime-data $data --wheel $wheels[0].FullName --requirements $requirements
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          "CYTELLECT_RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CYTELLECT_RELEASE_ZIP=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Fresh setup with pinned Python and actual Fiji
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'package-source'
          $install = Join-Path $env:RUNNER_TEMP 'installed-cytellect'
          Expand-Archive -LiteralPath $env:CYTELLECT_RELEASE_ZIP -DestinationPath $source
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "$source\scripts\local_setup.ps1" -SourceRoot $source -InstallRoot $install -Console -NoShortcut
          if ($LASTEXITCODE -ne 0) { throw 'Pinned installation or Fiji verification failed' }
          "CYTELLECT_INSTALL_ROOT=$install" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Repeat setup in the existing private installation
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'package-source'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "$source\scripts\local_setup.ps1" -SourceRoot $source -InstallRoot $env:CYTELLECT_INSTALL_ROOT -Console -NoShortcut
          if ($LASTEXITCODE -ne 0) { throw 'Repeat installation failed' }
      - name: Installed image, planning and registration workflows with numerical replay
        shell: pwsh
        run: |
          $completed = @(Get-ChildItem -LiteralPath "$env:CYTELLECT_INSTALL_ROOT\apps" -Filter setup-complete.json -Recurse)
          if ($completed.Count -ne 1) { throw 'Expected exactly one installed application' }
          $setup = Get-Content -LiteralPath $completed[0].FullName -Raw | ConvertFrom-Json
          if ($setup.source_commit -ne $env:GITHUB_SHA) { throw 'Installed revision mismatch' }
          $python = Join-Path $setup.app '.venv\Scripts\python.exe'
          $web = Join-Path $setup.app 'apps\web\out'
          $data = Join-Path $env:CYTELLECT_INSTALL_ROOT 'data'
          $acceptance = Join-Path $env:RUNNER_TEMP 'installed-acceptance'
          New-Item -ItemType Directory -Path $acceptance | Out-Null
          "CYTELLECT_ACCEPTANCE_DIR=$acceptance" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:CYTELLECT_TEST_PYTHON = $python
          $env:CYTELLECT_TEST_DATA_DIR = $data
          $env:CYTELLECT_TEST_REGION_FIXTURES = $null
          $env:CYTELLECT_SCREENSHOT_DIR = $null
          $env:PYTHONPATH = $null
          $env:PYTHONHOME = $null
          $env:PLAYWRIGHT_JSON_OUTPUT_FILE = Join-Path $acceptance 'private-browser-results.json'
          $receipt = @{
            schema = 'cytellect-installed-release-acceptance/1'; source_commit = $env:GITHUB_SHA
            version = $env:RELEASE_VERSION; archive_sha256 = (Get-FileHash -LiteralPath $env:CYTELLECT_RELEASE_ZIP).Hash.ToLowerInvariant()
            harness_sha256 = (Get-FileHash -LiteralPath 'scripts/verify_installed_regions.py').Hash.ToLowerInvariant()
            browser = @{ passed = $false; expected_cases = 15 }
            numerical_replay_passed = $false; launcher_stopped = $false
            scope = 'Installed public microscopy, planning and retry workflows with generated numerical references; no private-study or human-usability acceptance'
          }
          $arguments = @('-B', '-m', 'cytellect_api.local', '--data-dir', "`"$data`"", '--web-dir', "`"$web`"", '--fiji', "`"$($setup.fiji)`"", '--no-browser')
          $launcher = Start-Process -FilePath $python -ArgumentList $arguments -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($launcher.HasExited) { throw 'Installed launcher exited early' }
              try {
                $response = Invoke-WebRequest -Uri "$env:CYTELLECT_WEB_URL/v1/local/setup" -UseBasicParsing
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Installed application did not start' }
            pnpm --filter @cytellect/web test:e2e tests/local-workspace.spec.ts tests/generic-workspace.spec.ts tests/nuclear-region-comparison.spec.ts tests/plan-batch-workflow.spec.ts tests/region-trace.spec.ts tests/batch-common-metadata.spec.ts tests/comparison-hierarchy.spec.ts tests/area-only.spec.ts --reporter=json
            $browserExit = $LASTEXITCODE
            if (Test-Path -LiteralPath $env:PLAYWRIGHT_JSON_OUTPUT_FILE) {
              $browser = Get-Content -LiteralPath $env:PLAYWRIGHT_JSON_OUTPUT_FILE -Raw | ConvertFrom-Json
              $receipt.browser = @{ passed = ($browserExit -eq 0 -and $browser.stats.expected -eq 15 -and $browser.stats.unexpected -eq 0 -and $browser.stats.skipped -eq 0 -and $browser.stats.flaky -eq 0)
                expected_cases = 15; passed_cases = $browser.stats.expected; failed_cases = $browser.stats.unexpected
                skipped_cases = $browser.stats.skipped; flaky_cases = $browser.stats.flaky }
            }
            if (-not $receipt.browser.passed) { throw 'Installed browser verification failed or incomplete' }
            & $python -B scripts/verify_installed_regions.py --app $setup.app --expected-source $env:GITHUB_SHA --origin $env:CYTELLECT_WEB_URL --output (Join-Path $acceptance 'generated-regions')
            if ($LASTEXITCODE -ne 0) { throw 'Installed independent numerical or replay verification failed' }
            $numerical = Get-Content -LiteralPath (Join-Path $acceptance 'generated-regions/receipt.json') -Raw | ConvertFrom-Json
            $receipt.numerical_replay_passed = ($numerical.passed -eq $true -and $numerical.identity.source_commit -eq $env:GITHUB_SHA -and $numerical.harness_sha256 -eq $receipt.harness_sha256)
            if (-not $receipt.numerical_replay_passed) { throw 'Installed numerical receipt identity mismatch' }
          } finally {
            if (-not $launcher.HasExited) { Stop-Process -Id $launcher.Id }
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              if (-not (Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue)) {
                $receipt.launcher_stopped = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            $receipt | ConvertTo-Json -Depth 6 | Out-File -LiteralPath (Join-Path $acceptance 'receipt.json') -Encoding utf8
            if (-not $receipt.launcher_stopped) { throw 'Installed listener remained after stopping its launcher' }
          }
      - name: Retain scoped acceptance receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-release-acceptance
          path: |
            ${{ env.CYTELLECT_ACCEPTANCE_DIR }}/receipt.json
            ${{ env.CYTELLECT_ACCEPTANCE_DIR }}/generated-regions/receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ env.CYTELLECT_RELEASE_DIR }}/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Create the exact source tag without overwriting an existing ref
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              ...context.repo,
              ref: `refs/tags/v${process.env.RELEASE_VERSION}`,
              sha: context.sha
            });
      - name: Create a draft prerelease for final review
        shell: bash
        run: |
          printf '%s\n' "Source: $GITHUB_SHA" '' 'Pinned signed Python setup, fifteen installed browser cases covering public GFP/generic nuclear regions, planning adoption, registration retries, saved source/experimental hierarchy and area-only measurement/planning, and independent generated-pixel comparison/replay checks passed. Review the exact-source acceptance receipts and scientific limits before publishing. Public-image segmentation accuracy, private-study validation and human usability are separate gates.' > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$RELEASE_VERSION" release/* --verify-tag --draft --prerelease --title "Cytellect $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
