name: Cellpose Modal deploy
# Deploys the remote Cellpose GPU server (infra/modal_cellpose.py) to Modal from
# main. This is a paid-service release step: run it only on the owner's explicit
# instruction. The Modal deploy token lives only in the secrets of the `modal-deploy`
# environment, which the owner restricts to main (docs/cloud-gpu.ja.md): a workflow
# on another branch cannot read it. Repository-wide secrets are not used.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cellpose-modal-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: modal-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: "3.12"}
      - run: python -m pip install --require-hashes --no-deps -r infra/modal-requirements.txt
      - name: Deploy and record the server URL
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          modal token info
          modal deploy infra/modal_cellpose.py | tee deploy.log
          # Server URLs are *.modal.direct (older web endpoints *.modal.run). A log without one is not a
          # failed deploy: the next step checks the deployed server itself.
          { grep -oE 'https://[A-Za-z0-9.-]+\.modal\.(direct|run)' deploy.log || true; } | sort -u | sed 's/^/Server: /' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the public-image acceptance runtime
        run: |
          python -m pip install uv==0.12.2
          uv sync --locked --no-dev
          git fetch origin 3090c044fe642b989d51c1c6acca1f4778ae3ea8
          uv run --no-sync python scripts/fiji_setup.py "$RUNNER_TEMP/model-check-fiji"
      - name: Verify deployed checkpoints and the released client's baseline compatibility
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          CYTELLECT_FIJI_EXECUTABLE: ${{ runner.temp }}/model-check-fiji
        run: uv run --no-sync python scripts/cellpose_modal_check.py --receipt "$RUNNER_TEMP/cellpose-modal-check.json"
      - name: Keep only aggregate public-image execution evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cellpose-modal-check
          path: ${{ runner.temp }}/cellpose-modal-check.json
          retention-days: 30
