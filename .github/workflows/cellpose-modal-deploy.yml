name: Cellpose Modal deploy
# Deploys the remote Cellpose GPU server (infra/modal_cellpose.py) to Modal from
# main. This is a paid-service release step: run it only on the owner's explicit
# instruction. The Modal deploy token lives only in the repository secrets.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cellpose-modal-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --require-hashes --no-deps -r infra/modal-requirements.txt
      - name: Deploy and record the server URL
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal deploy infra/modal_cellpose.py | tee deploy.log
          grep -o 'https://[A-Za-z0-9.-]*\.modal\.run' deploy.log | sort -u | sed 's/^/Server: /' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the public-image acceptance runtime
        run: |
          python -m pip install uv==0.12.2
          uv sync --locked --no-dev
          git fetch origin 3090c044fe642b989d51c1c6acca1f4778ae3ea8
          uv run --no-sync python scripts/fiji_setup.py "$RUNNER_TEMP/model-check-fiji"
      - name: Verify deployed checkpoints and the released client's baseline compatibility
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          CYTELLECT_FIJI_EXECUTABLE: ${{ runner.temp }}/model-check-fiji
        run: uv run --no-sync python scripts/cellpose_modal_check.py --receipt "$RUNNER_TEMP/cellpose-modal-check.json"
      - name: Keep only aggregate public-image execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellpose-modal-check
          path: ${{ runner.temp }}/cellpose-modal-check.json
          retention-days: 30
