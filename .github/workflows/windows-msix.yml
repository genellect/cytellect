name: Verify Windows Store package
on:
  pull_request:
    paths:
      - '.github/workflows/windows-msix.yml'
      - 'apps/web/**'
      - 'engines/fiji/**'
      - 'engines/python/**'
      - 'fixtures/public/bbbc013/**'
      - 'packages/**'
      - 'services/**'
      - 'packaging/windows/**'
      - 'scripts/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-msix:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One scenario per runner. After the first scenario removes the package, a file under the
      # workspace's data\tmp stays open in another process for more than two minutes, so a second
      # scenario on the same runner cannot start from an empty folder.
      matrix:
        scenario: [fresh, migration]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MSIX_VERSION: "1.0.1.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: {node-version: "24"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --group build
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Restore pinned Windows build downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/installer-cache
          key: windows-msix-${{ hashFiles('engines/fiji/runtime.lock.json', 'engines/fiji/corresponding-source.lock.json', 'engines/fiji/source-exceptions.json', 'engines/python/windows-runtime.lock.json', 'uv.lock', 'scripts/build_windows_installer.py', 'scripts/corresponding_source.py') }}
      - name: Build the current Windows ZIP and the unsigned development MSIX
        shell: pwsh
        run: |
          $msix = Join-Path $env:RUNNER_TEMP 'msix/Cytellect-Development.msix'
          ./packaging/windows/msix/ci-build.ps1 -Commit $env:GITHUB_SHA -Version $env:MSIX_VERSION -ReleaseVersion 0.1.0-ci.1 -Output $msix -Scratch (Join-Path $env:RUNNER_TEMP 'msix-inputs')
          "CYTELLECT_MSIX=$msix" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Sign only the development package and trust it on this runner
        shell: pwsh
        run: ./packaging/windows/msix/ci-sign.ps1 -Msix $env:CYTELLECT_MSIX -Publisher 'CN=Cytellect Development'
      - name: Activate from the shell, analyze and save a public image, reinstall and audit native loads
        if: matrix.scenario == 'fresh'
        shell: pwsh
        run: |
          ./packaging/windows/sac-audit.ps1 -Msix -Installer $env:CYTELLECT_MSIX -Version $env:MSIX_VERSION -Checkout (Get-Location).Path -Output (Join-Path $env:RUNNER_TEMP 'msix-verification')
      - name: Reopen an analysis saved with the published EXE in the MSIX and analyze beside it
        if: matrix.scenario == 'migration'
        shell: pwsh
        run: |
          ./packaging/windows/msix/ci-migration.ps1 -Msix $env:CYTELLECT_MSIX -Version $env:MSIX_VERSION -Checkout (Get-Location).Path -Output (Join-Path $env:RUNNER_TEMP 'msix-verification/exe-migration.json')
      - name: Retain the build and acceptance receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-msix-receipts-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/msix/Cytellect-Development.json
            ${{ runner.temp }}/msix-verification/sac-audit.json
            ${{ runner.temp }}/msix-verification/exe-migration.json
          if-no-files-found: ignore
          retention-days: 14
