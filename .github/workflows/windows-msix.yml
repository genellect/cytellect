name: Verify Windows Store package
on:
  pull_request:
    paths:
      - '.github/workflows/windows-msix.yml'
      - 'apps/web/**'
      - 'engines/fiji/**'
      - 'engines/python/**'
      - 'fixtures/public/bbbc013/**'
      - 'packages/**'
      - 'services/**'
      - 'packaging/windows/**'
      - 'scripts/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-msix:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One scenario per runner. After the first scenario removes the package, a file under the
      # workspace's data\tmp stays open in another process for more than two minutes, so a second
      # scenario on the same runner cannot start from an empty folder.
      matrix:
        scenario: [fresh, migration]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MSIX_VERSION: "1.0.1.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: {node-version: "24"}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: "3.12"}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --group build
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Restore pinned Windows build downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/installer-cache
          key: windows-msix-${{ hashFiles('engines/fiji/runtime.lock.json', 'engines/fiji/corresponding-source.lock.json', 'engines/fiji/source-exceptions.json', 'engines/python/windows-runtime.lock.json', 'uv.lock', 'scripts/build_windows_installer.py', 'scripts/corresponding_source.py') }}
      - name: Build the current Windows ZIP and the unsigned development MSIX
        shell: pwsh
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'msix-inputs'
          $output = Join-Path $env:RUNNER_TEMP 'msix'
          New-Item -ItemType Directory -Path $inputs, $output | Out-Null
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          $data = Join-Path $inputs 'windows-tcltk-9.0.4-data.zip'
          $archive = Join-Path $inputs 'Cytellect-0.1.0-ci.1-windows-x64.zip'
          $msix = Join-Path $output 'Cytellect-Development.msix'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare_windows_runtime_data.ps1 -Python $python -CacheRoot (Join-Path $inputs 'cache') -ScratchRoot (Join-Path $inputs 'extraction') -Output $data
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime data preparation failed' }
          & $python -B -m hatchling build -t wheel -d (Join-Path $inputs 'wheels')
          if ($LASTEXITCODE -ne 0) { throw 'Locked wheel build failed' }
          $requirements = Join-Path $inputs 'requirements.txt'
          uv export --locked --no-dev --no-emit-project --no-header --output-file $requirements | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Hashed production dependency export failed' }
          $wheels = @(Get-ChildItem -LiteralPath (Join-Path $inputs 'wheels') -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected one project wheel' }
          & $python -B scripts/build_local_bundle.py --version 0.1.0-ci.1 --output $archive --runtime-data $data --wheel $wheels[0].FullName --requirements $requirements
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP build failed' }
          & $python -B scripts/build_windows_msix.py --release-zip $archive --commit $env:GITHUB_SHA --version $env:MSIX_VERSION --output $msix --cache (Join-Path $env:RUNNER_TEMP 'installer-cache') --pip-python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'MSIX build failed' }
          "CYTELLECT_MSIX=$msix" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Sign only the development package and trust it on this runner
        shell: pwsh
        run: |
          $sign = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $sign) { throw 'Windows SDK SignTool missing' }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Cytellect Development' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(2)
          try {
            & $sign.FullName sign /sha1 $cert.Thumbprint /fd SHA256 $env:CYTELLECT_MSIX
            if ($LASTEXITCODE -ne 0) { throw 'Development MSIX signing failed' }
            $public = Join-Path $env:RUNNER_TEMP 'cytellect-development.cer'
            Export-Certificate -Cert $cert -FilePath $public | Out-Null
            Import-Certificate -FilePath $public -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          } finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          }
      - name: Activate from the shell, analyze and save a public image, reinstall and audit native loads
        if: matrix.scenario == 'fresh'
        shell: pwsh
        run: |
          ./packaging/windows/sac-audit.ps1 -Msix -Installer $env:CYTELLECT_MSIX -Version $env:MSIX_VERSION -Checkout (Get-Location).Path -Output (Join-Path $env:RUNNER_TEMP 'msix-verification')
      - name: Reopen an analysis saved with the published EXE in the MSIX and analyze beside it
        if: matrix.scenario == 'migration'
        shell: pwsh
        run: |
          ./packaging/windows/msix/ci-migration.ps1 -Msix $env:CYTELLECT_MSIX -Version $env:MSIX_VERSION -Checkout (Get-Location).Path -Output (Join-Path $env:RUNNER_TEMP 'msix-verification/exe-migration.json')
      - name: Retain the build and acceptance receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-msix-receipts-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/msix/Cytellect-Development.json
            ${{ runner.temp }}/msix-verification/sac-audit.json
            ${{ runner.temp }}/msix-verification/exe-migration.json
          if-no-files-found: ignore
          retention-days: 14
