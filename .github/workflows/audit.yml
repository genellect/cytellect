name: Weekly audit
# Pull-request CI audits only the areas a change selects. This run audits the locked dependencies
# and the full history every week, so a new advisory against unchanged code still fails visibly.
on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .node-version}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12.14"}
      - run: npm install --global pnpm@11.19.0
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --dev
      - run: pnpm install --frozen-lockfile
      - name: Audit Python dependencies
        if: always()
        run: uv run pip-audit --local
      - name: Audit Web dependencies
        if: always()
        run: pnpm audit --prod --audit-level high
      - name: Scan complete history and tracked files with pinned Gitleaks
        if: always()
        run: uv run python scripts/scan_secrets.py --repo . --cache-dir "$RUNNER_TEMP/security-tools" --output "$RUNNER_TEMP/secrets.json"
