name: Verify MSIX package
on:
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'apps/web/package.json'
      - 'apps/web/src/app/icon.svg'
      - 'engines/python/**'
      - 'engines/fiji/**'
      - 'scripts/build_local_bundle.py'
      - 'scripts/*msix*'
      - 'services/api/src/cytellect_api/msix.py'
      - 'services/api/src/cytellect_api/local.py'
      - 'apps/web/scripts/export-msix-icons.mjs'
      - 'tests/test_msix.py'
      - '.github/workflows/msix.yml'
  workflow_dispatch:
    inputs:
      retain_package:
        description: 'Publish unsigned review binary after owner authorization and redistribution review'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --group build
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node apps/web/node_modules/@playwright/test/cli.js install chromium
      - name: Build exact source bundle and fully bundled MSIX
        shell: pwsh
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'msix-inputs'
          New-Item -ItemType Directory -Path $inputs | Out-Null
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          $data = Join-Path $inputs 'windows-tcltk-9.0.4-data.zip'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare_windows_runtime_data.ps1 -Python $python -CacheRoot (Join-Path $inputs 'cache') -ScratchRoot (Join-Path $inputs 'extraction') -Output $data
          if ($LASTEXITCODE -ne 0) { throw 'Runtime data preparation failed' }
          & $python -B -m hatchling build -t wheel -d (Join-Path $inputs 'wheels')
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          $requirements = Join-Path $inputs 'requirements.txt'
          uv export --locked --no-dev --no-emit-project --no-header --output-file $requirements
          if ($LASTEXITCODE -ne 0) { throw 'Lock export failed' }
          $wheel = @(Get-ChildItem (Join-Path $inputs 'wheels') -Filter '*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected one wheel' }
          $zip = Join-Path $inputs 'source.zip'
          & $python -B scripts/build_local_bundle.py --version 0.1.0-msix.1 --output $zip --runtime-data $data --wheel $wheel[0].FullName --requirements $requirements
          if ($LASTEXITCODE -ne 0) { throw 'Source bundle failed' }
          $output = Join-Path $env:RUNNER_TEMP 'msix-output/Cytellect-development-x64.msix'
          & scripts/build_msix.ps1 -SourceZip $zip -Python $python -WorkRoot (Join-Path $env:RUNNER_TEMP 'msix-build') -Output $output
          if (-not $?) { throw 'MSIX build failed' }
      - name: Install, activate, analyse and verify uninstall retention on disposable runner
        shell: pwsh
        run: |
          & scripts/verify_msix.ps1 -Package (Join-Path $env:RUNNER_TEMP 'msix-output/Cytellect-development-x64.msix') -WorkRoot (Join-Path $env:RUNNER_TEMP 'msix-acceptance')
          if (-not $?) { throw 'MSIX installed acceptance failed' }
      - name: Retain unsigned review package after acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.retain_package
        uses: actions/upload-artifact@v4
        with:
          name: cytellect-msix-development
          path: ${{ runner.temp }}/msix-output/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain scoped receipt without images, tokens, certificates or raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cytellect-msix-acceptance
          path: ${{ runner.temp }}/msix-acceptance/receipt.json
          if-no-files-found: ignore
          retention-days: 7
