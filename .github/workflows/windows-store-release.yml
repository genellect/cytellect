name: Windows Store release
# Enabled only after the owner allows the general Store release (docs/windows-msix.md#main-から提出する).
# Each main commit is built once, the same package is installed and accepted on fresh runners, and
# only an accepted package reaches the approval-gated submission job.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build and accept a new package instead of reusing the accepted package of the main head
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    if: >-
      github.ref == 'refs/heads/main' && vars.STORE_SUBMISSIONS_ENABLED == 'true' &&
      vars.STORE_MSIX_PUBLISHER != '' && (github.event_name == 'push' || inputs.rebuild)
    runs-on: windows-latest
    timeout-minutes: 120
    concurrency:
      group: store-msix-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: {node-version: '24'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --group build
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/installer-cache
          key: windows-msix-${{ hashFiles('engines/fiji/runtime.lock.json', 'engines/fiji/corresponding-source.lock.json', 'engines/fiji/source-exceptions.json', 'engines/python/windows-runtime.lock.json', 'uv.lock', 'scripts/build_windows_installer.py', 'scripts/corresponding_source.py') }}
      - name: Build an unsigned MSIX with the Store product identity
        shell: pwsh
        env:
          STORE_PUBLISHER: ${{ vars.STORE_MSIX_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          if (!$env:STORE_PUBLISHER_DISPLAY_NAME) { throw 'The Store publisher display name is required' }
          $buildNumber = [int]$env:GITHUB_RUN_NUMBER + 3
          if ($buildNumber -gt 65535) { throw 'MSIX build number exhausted' }
          $inputs = Join-Path $env:RUNNER_TEMP 'store-inputs'
          $identity = Join-Path $env:RUNNER_TEMP 'store-identity.json'
          @{
            name = '24D2FD66.Cytellect'
            publisher = $env:STORE_PUBLISHER
            publisher_display_name = $env:STORE_PUBLISHER_DISPLAY_NAME
          } | ConvertTo-Json | Set-Content -LiteralPath $identity -Encoding utf8NoBOM
          ./packaging/windows/msix/ci-build.ps1 -Commit $env:GITHUB_SHA -Version "1.0.$buildNumber.0" -ReleaseVersion "0.1.0-store.$buildNumber" -Output (Join-Path $env:RUNNER_TEMP 'store-msix/Cytellect-Store.msix') -Scratch $inputs -Identity $identity
      - uses: actions/upload-artifact@v6
        with:
          name: store-msix-${{ github.sha }}
          path: ${{ runner.temp }}/store-msix/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
  accept:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One scenario per runner, as in windows-msix.yml. Both install the same built package.
      matrix:
        scenario: [fresh, migration]
    concurrency:
      group: store-msix-accept-${{ github.ref }}-${{ matrix.scenario }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: store-msix-${{ github.sha }}
          path: ${{ runner.temp }}/store-package
      - name: Sign a copy of the Store package for this runner only
        shell: pwsh
        env:
          STORE_PUBLISHER: ${{ vars.STORE_MSIX_PUBLISHER }}
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'store-package'
          $receipt = Get-Content -Raw -LiteralPath (Join-Path $package 'Cytellect-Store.json') | ConvertFrom-Json
          $unsigned = Join-Path $package 'Cytellect-Store.msix'
          if ((Get-FileHash -LiteralPath $unsigned -Algorithm SHA256).Hash.ToLowerInvariant() -cne $receipt.msix_sha256 -or
              $receipt.source_commit -cne $env:GITHUB_SHA) { throw 'The downloaded package does not match its receipt' }
          # The Store signs the submitted package; the unsigned original is left unchanged.
          $signed = Join-Path $env:RUNNER_TEMP 'Cytellect-Store-test.msix'
          ./packaging/windows/msix/ci-sign.ps1 -Msix $unsigned -Publisher $env:STORE_PUBLISHER -Output $signed
          "CYTELLECT_MSIX=$signed" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CYTELLECT_MSIX_VERSION=$($receipt.version)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Activate from the shell, analyze and save a public image, reinstall and audit native loads
        if: matrix.scenario == 'fresh'
        shell: pwsh
        run: |
          ./packaging/windows/sac-audit.ps1 -Msix -Installer $env:CYTELLECT_MSIX -Version $env:CYTELLECT_MSIX_VERSION -Checkout (Get-Location).Path -Output (Join-Path $env:RUNNER_TEMP 'store-acceptance')
      - name: Reopen an analysis saved with the published EXE in the Store package and analyze beside it
        if: matrix.scenario == 'migration'
        shell: pwsh
        run: |
          ./packaging/windows/msix/ci-migration.ps1 -Msix $env:CYTELLECT_MSIX -Version $env:CYTELLECT_MSIX_VERSION -Checkout (Get-Location).Path -Output (Join-Path $env:RUNNER_TEMP 'store-acceptance/exe-migration.json')
      - uses: actions/upload-artifact@v6
        with:
          name: store-msix-accepted-${{ github.sha }}-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/store-package/Cytellect-Store.json
            ${{ runner.temp }}/store-acceptance/sac-audit.json
            ${{ runner.temp }}/store-acceptance/exe-migration.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  select:
    needs: accept
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      vars.STORE_SUBMISSIONS_ENABLED == 'true' &&
      (needs.accept.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.rebuild))
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run-id: ${{ steps.candidate.outputs.run-id }}
    steps:
      - id: candidate
        uses: actions/github-script@v8
        with:
          script: |
            async function artifacts(name) {
              const {data} = await github.rest.actions.listArtifactsForRepo({
                ...context.repo, name, per_page: 100,
              });
              return data.artifacts.filter(item => !item.expired &&
                item.workflow_run?.head_branch === 'main' &&
                item.workflow_run?.head_sha === context.sha &&
                item.workflow_run?.head_repository_id === context.payload.repository.id);
            }
            if ((await artifacts(`store-submitted-${context.sha}`)).length) {
              core.info('This main commit was already accepted by the Store.');
              return;
            }
            const runs = async scenario => new Set((await artifacts(
              `store-msix-accepted-${context.sha}-${scenario}`)).map(item => item.workflow_run.id));
            const [fresh, migration] = await Promise.all([runs('fresh'), runs('migration')]);
            const candidate = (await artifacts(`store-msix-${context.sha}`)).find(item =>
              fresh.has(item.workflow_run.id) && migration.has(item.workflow_run.id));
            if (candidate) {
              core.setOutput('run-id', String(candidate.workflow_run.id));
            } else {
              core.notice('No accepted Store package exists for this main commit. Run the workflow with rebuild.');
            }
  submit:
    needs: select
    if: needs.select.outputs.run-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: store-release
    permissions:
      actions: read
      contents: read
    concurrency:
      group: windows-store-submission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.run-id }}
          name: store-msix-${{ github.sha }}
          path: store-package
      - name: Submit the current main package for certification
        id: submission
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            printf '%s\n' 'A newer main commit is available. Skipping this package.'
            exit 0
          fi
          python -B scripts/submit_windows_msix.py --commit "$GITHUB_SHA" --package store-package/Cytellect-Store.msix --receipt store-package/Cytellect-Store.json
      - uses: actions/upload-artifact@v6
        if: steps.submission.outputs.accepted == 'true'
        with:
          name: store-submitted-${{ github.sha }}
          path: store-package/Cytellect-Store.json
          retention-days: 14
