name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A release requires every check on the exact main commit it ships (local-release.yml), so a run
# on main is never cancelled or replaced: each one gets its own group (a later merge would
# otherwise cancel it, or replace it while it waits). Pull requests and manual runs on other
# branches keep one group per ref, and a newer run cancels the superseded one.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('verify-main-{0}', github.run_id) || format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.classify.outputs.python }}
      web: ${{ steps.classify.outputs.web }}
      lp: ${{ steps.classify.outputs.lp }}
      fiji: ${{ steps.classify.outputs.fiji }}
      windows: ${{ steps.classify.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Select job areas from changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changes.py
  python:
    needs: changes
    runs-on: ubuntu-latest
    # Font provisioning can consume twelve minutes before the seven-minute suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Japanese figure font for required rendering checks
        if: needs.changes.outputs.python == 'true'
        run: bash scripts/install_figure_font.sh
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --dev
      - if: needs.changes.outputs.python == 'true'
        run: uv run ruff check .
      - if: needs.changes.outputs.python == 'true'
        run: uv run mypy packages/analysis/src services
      - name: Verify versioned planning candidates and cross-language fixtures
        if: needs.changes.outputs.python == 'true'
        run: uv run python scripts/generate_planning_fixtures.py --check
      - if: needs.changes.outputs.python == 'true'
        run: uv run pytest tests -m "not fiji" --junitxml=/tmp/cytellect-scientific-tests.xml --scientific-collection=/tmp/cytellect-scientific-collection.json
      - name: Independent scientific regression receipt
        if: always() && needs.changes.outputs.python == 'true'
        run: uv run python scripts/scientific_review.py --junit /tmp/cytellect-scientific-tests.xml --collection /tmp/cytellect-scientific-collection.json --output /tmp/cytellect-compliance/scientific-review.json --source-commit "${{ github.sha }}"
      - name: Retain scoped scientific evidence without raw logs
        if: always() && needs.changes.outputs.python == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scientific-review
          path: /tmp/cytellect-compliance/scientific-review.json
          if-no-files-found: error
          retention-days: 14
      - run: uv run python scripts/check_public_tree.py
      - run: uv run python scripts/check_docs.py
      - if: needs.changes.outputs.python == 'true'
        run: uv run python scripts/proposal_schema.py --check
      # The public demo runs the committed Cytellect wheel. Pull requests are not made to rebuild it
      # (every Python PR would then conflict on the wheel); main reports drift until the deploy builds it.
      - name: Report whether the public demo runtime matches the analysis sources
        if: github.event_name == 'push' && needs.changes.outputs.python == 'true'
        run: uv run python scripts/build_showcase_runtime.py --check --cache /tmp/cytellect-showcase-cache || echo "::warning::The public demo runtime is older than the analysis sources; rebuild it with scripts/build_showcase_runtime.py"
      - name: Packaged documentation and change classification (Python suite not selected)
        if: needs.changes.outputs.python != 'true'
        run: uv run pytest tests/test_local_bundle.py tests/test_ci_changes.py
      - name: Scan complete history and tracked files with pinned Gitleaks
        id: secrets
        run: uv run python scripts/scan_secrets.py --repo . --cache-dir /tmp/cytellect-security-tools --output /tmp/cytellect-compliance/secrets.json
      - name: Retain aggregate scanner receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-summary
          path: /tmp/cytellect-compliance/secrets.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify secret scanner boundaries with the pinned tool
        env:
          CYTELLECT_GITLEAKS_TEST_CACHE: /tmp/cytellect-security-tools
        run: uv run pytest tests/test_scan_secrets.py
      - name: Audit Python dependencies and emit CycloneDX SBOM
        if: needs.changes.outputs.python == 'true'
        run: |
          mkdir -p /tmp/cytellect-compliance
          uv run pip-audit --local --format cyclonedx-json --output /tmp/cytellect-compliance/python.cdx.json
      - name: Retain successful Python dependency SBOM
        if: needs.changes.outputs.python == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-sbom
          path: /tmp/cytellect-compliance/python.cdx.json
          if-no-files-found: error
          retention-days: 7
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CYTELLECT_DATA_DIR: /tmp/cytellect-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: npm install --global pnpm@11.19.0
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --dev
      - run: pnpm install --frozen-lockfile
      - run: uv run cytellect openapi --output packages/contracts/openapi.json --recipe-defaults apps/web/src/lib/recipe-defaults.json
      - run: pnpm contracts
      - run: git diff --exit-code -- packages/contracts apps/web/src/lib/generated.ts apps/web/src/lib/recipe-defaults.json
      - run: pnpm check
      - run: pnpm test
      - name: Verify the proposal service source (not deployed by CI)
        run: pnpm --filter @cytellect/proposal-worker check && pnpm --filter @cytellect/proposal-worker test && pnpm --filter @cytellect/proposal-worker test:deployment
      - run: node --test apps/web/scripts/finalize-local-export.test.mjs
      - run: pnpm build
      - name: Locate the pinned browser version
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the test browser
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser for public-site regression
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @cytellect/web exec playwright install --with-deps chromium
      - name: Verify public LP and published-image viewer without an analysis API
        env:
          CYTELLECT_EXPECT_UNCONFIGURED: "1"
          CYTELLECT_WEB_URL: http://127.0.0.1:3000
        run: |
          pnpm --filter @cytellect/web start > /tmp/cytellect-public-web.log 2>&1 &
          public_web_pid=$!
          trap 'kill "$public_web_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000 >/dev/null
          pnpm --filter @cytellect/web exec playwright test tests/marketing.spec.ts tests/public-demo.spec.ts tests/lp-viewport-review.spec.ts tests/lp-analytics.spec.ts tests/showcase.spec.ts tests/workspace-layout.spec.ts tests/workspace-entry.spec.ts --grep-invert "published Windows asset downloads"
      # The local release ships apps/web/out; a generated file the packager rejects
      # (for example sitemap.xml) must fail here, not after merge in fiji-browser and windows-installed.
      # Runs after the public-site checks because the static export reuses the .next directory.
      - name: Local release web output fits the packager's boundary
        run: |
          pnpm --filter @cytellect/web build:local
          uv run python scripts/check_local_web_bundle.py
      - run: pnpm audit --prod --audit-level high
      - name: Verify installed license evidence and generate combined inventory
        run: uv run python scripts/sbom.py --output /tmp/cytellect-compliance/dependency-inventory.json --web-notices /tmp/cytellect-compliance/THIRD_PARTY_WEB_NOTICES.txt
      - name: Retain dependency inventory and redistribution notices
        uses: actions/upload-artifact@v4
        with:
          name: dependency-license-evidence
          path: |
            /tmp/cytellect-compliance/dependency-inventory.json
            /tmp/cytellect-compliance/THIRD_PARTY_WEB_NOTICES.txt
          if-no-files-found: error
          retention-days: 7
  lp:
    # Landing-page-only pull requests: the Next.js checks and build, and the landing-page browser tests.
    # Contracts, the proposal Worker, the demo and dependency evidence are left to the web job, which
    # runs instead of this one whenever anything else in the web area changes (and on every push to main).
    needs: changes
    if: needs.changes.outputs.lp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm install --global pnpm@11.19.0
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Locate the pinned browser version
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the test browser
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser for the landing-page tests
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @cytellect/web exec playwright install --with-deps chromium
      - name: Verify the public landing page without an analysis API
        env:
          CYTELLECT_EXPECT_UNCONFIGURED: "1"
          CYTELLECT_WEB_URL: http://127.0.0.1:3000
        run: |
          pnpm --filter @cytellect/web start > /tmp/cytellect-public-web.log 2>&1 &
          public_web_pid=$!
          trap 'kill "$public_web_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000 >/dev/null
          pnpm --filter @cytellect/web exec playwright test tests/marketing.spec.ts tests/public-demo.spec.ts tests/lp-viewport-review.spec.ts tests/lp-analytics.spec.ts --grep-invert "published Windows asset downloads"
  fiji-browser:
    needs: changes
    # Integration jobs run after merge (every push to main) and on manual runs (the batch verification
    # before merging), not on each pull request; the release workflow still requires them on the released commit.
    if: github.event_name != 'pull_request' && needs.changes.outputs.fiji == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CYTELLECT_DATA_DIR: /tmp/cytellect-browser
      CYTELLECT_TEST_DATA_DIR: /tmp/cytellect-browser
      CYTELLECT_APP_ORIGIN: http://localhost:3000
      CYTELLECT_SECURE_COOKIES: "false"
      CYTELLECT_FIJI_EXECUTABLE: /tmp/cytellect-fiji
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: bash scripts/install_figure_font.sh
      - run: python -m pip install uv==0.12.2
      - run: npm install --global pnpm@11.19.0
      - run: uv sync --locked --dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cytellect/web exec playwright install --with-deps chromium
      - run: uv run python scripts/fiji_setup.py /tmp/cytellect-fiji --platform linux-x64
      - run: uv run pytest -m fiji
      - name: Published DNA-actin inputs and independent ImageJ arithmetic
        timeout-minutes: 10
        run: |
          uv run python scripts/public_bbbc007.py --data-dir /tmp/cytellect-bbbc007 --download
          uv run python scripts/public_bbbc007.py --data-dir /tmp/cytellect-bbbc007 --evaluate /tmp/cytellect-bbbc007-run --fiji /tmp/cytellect-fiji
          uv run python scripts/public_bbbc007.py --data-dir /tmp/cytellect-bbbc007 --check-report /tmp/cytellect-bbbc007-run/benchmark.json
          uv run python scripts/prepare_workspace_bbbc007.py --data-dir /tmp/cytellect-bbbc007 --output /tmp/cytellect-workspace-inputs
          uv run python scripts/check_public_uploads.py /tmp/cytellect-workspace-inputs
      - name: Retain public-image execution summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-bbbc007-execution
          path: /tmp/cytellect-bbbc007-run/benchmark.json
          if-no-files-found: error
          retention-days: 14
      - run: pnpm build
      - name: Browser workflow against real API and Fiji
        env:
          CYTELLECT_WEB_URL: http://localhost:3000
          CYTELLECT_TEST_API_ORIGIN: http://localhost:8000
          CYTELLECT_REAL_INPUTS: /tmp/cytellect-workspace-inputs
          CYTELLECT_REAL_OUTPUT: /tmp/cytellect-workspace-evidence
          CYTELLECT_REQUIRE_REAL_FIJI: "1"
        run: |
          export CYTELLECT_TEST_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          uv run cytellect serve > /tmp/cytellect-api.log 2>&1 &
          uv run cytellect-worker > /tmp/cytellect-worker.log 2>&1 &
          pnpm --filter @cytellect/web start > /tmp/cytellect-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000 >/dev/null && curl --fail --silent http://localhost:8000/v1/health >/dev/null; then break; fi
            sleep 1
          done
          pnpm test:e2e
      - name: Retain only registered public workspace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-workspace-fiji
          path: |
            /tmp/cytellect-workspace-evidence/receipt.json
            /tmp/cytellect-workspace-evidence/bbbc007-before.png
            /tmp/cytellect-workspace-evidence/bbbc007-after.png
            /tmp/cytellect-workspace-evidence/figure.svg
            /tmp/cytellect-workspace-evidence/figure.pdf
            /tmp/cytellect-workspace-evidence/plot-data.csv
            /tmp/cytellect-workspace-evidence/methods.md
          if-no-files-found: error
          retention-days: 14
      - name: Compose configuration
        env:
          CYTELLECT_RUNTIME_DIR: /tmp/cytellect-compose
          CYTELLECT_REQUIRE_COMPOSE_TEST: "1"
        run: |
          docker compose config --quiet
          uv run pytest tests/test_proposal_compose.py -q
      - name: Build production web container with planning fixtures
        run: docker build -f infra/Dockerfile.web -t cytellect-web-ci .
      - name: Build production worker container
        run: docker build --target worker -f infra/Dockerfile.python -t cytellect-worker-ci .
      - name: Actual Fiji in non-root offline read-only container
        run: |
          sudo install -d -m 0700 -o 10001 -g 10001 /tmp/cytellect-container-smoke
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 5g \
            -v /tmp/cytellect-container-smoke:/data \
            cytellect-worker-ci python /app/scripts/container_smoke.py
      - name: Remote Cellpose service returns exactly the local labels (CPU, offline container)
        run: |
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 6g \
            -v /tmp/cytellect-container-smoke:/data -v "$PWD/fixtures/public/bbbc013:/fixtures:ro" \
            cytellect-worker-ci python /app/scripts/cellpose_remote_check.py --image /fixtures/A01-dapi.tif \
            --crop 320 --start-service --require-identical --receipt /data/cellpose-remote-check.json
      - name: Build and verify local browser delivery
        env:
          CYTELLECT_TEST_LOCAL: "1"
          CYTELLECT_WEB_URL: http://127.0.0.1:8765
        run: |
          pnpm --filter @cytellect/web build:local
          uv run python scripts/check_local_web_bundle.py
          uv run cytellect local --data-dir /tmp/cytellect-local --web-dir apps/web/out --fiji /tmp/cytellect-fiji --no-browser > /tmp/cytellect-local.log 2>&1 &
          LOCAL_PID=$!
          trap 'kill "$LOCAL_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8765/v1/local/setup >/dev/null; then break; fi
            sleep 1
          done
          pnpm --filter @cytellect/web exec playwright test tests/local-workspace.spec.ts tests/local-workspace-start.spec.ts
  cellpose-gpu-image:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.fiji == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Free disk space for the CUDA wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --dev
      - name: Build the remote GPU inference image
        run: docker build -f infra/Dockerfile.cellpose-gpu -t cytellect-cellpose-gpu-ci .
      - name: The CUDA image, served on CPU, returns exactly the CPU runtime's labels
        run: |
          uv run python scripts/cellpose_setup.py /tmp/cellpose-runtime --model-cache /tmp/cellpose-models --runtime-only
          docker run -d --name cellpose-gpu-ci -p 127.0.0.1:8080:8080 -e CYTELLECT_REQUIRE_GPU=0 \
            --read-only --tmpfs /tmp:rw,size=512m --cap-drop ALL --security-opt no-new-privileges cytellect-cellpose-gpu-ci
          for i in $(seq 1 150); do curl -fs http://127.0.0.1:8080/health >/dev/null && break; sleep 2; done
          CYTELLECT_CELLPOSE_PYTHON=/tmp/cellpose-runtime/bin/python CYTELLECT_CELLPOSE_MODEL_DIR=/tmp/cellpose-models \
          CYTELLECT_CELLPOSE_REMOTE_URL=http://127.0.0.1:8080 \
            uv run python scripts/cellpose_remote_check.py --image fixtures/public/bbbc013/A01-dapi.tif --crop 320 \
            --require-identical --receipt /tmp/cellpose-gpu-image-check.json
      - name: Service log carries no request content
        if: always()
        run: docker logs cellpose-gpu-ci 2>&1 | tail -5
  local-windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: node --test apps/web/scripts/finalize-local-export.test.mjs
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --dev
      - name: Loopback lifecycle and Windows setup boundaries
        run: uv run pytest tests/test_local.py tests/test_local_cold_start.py tests/test_process_owner.py tests/test_local_bundle.py tests/test_windows_setup.py tests/test_windows_setup_errors.py tests/test_windows_setup_completion.py tests/test_windows_runtime.py tests/test_windows_runtime_data.py tests/test_windows_runtime_prepare.py tests/test_local_revision.py tests/test_windows_installer.py tests/test_app_update.py
  windows-installed:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      CI_VERSION: 0.0.0-local.ci
      PREVIOUS_VERSION: 0.1.0-local.17
      PREVIOUS_SHA256: 1532f1e0b32eb7f9f457f82b6a9847e85c9a919a178c766b27f835cdcc0df51c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --group build
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Build the installable package from this exact commit
        shell: pwsh
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'package-inputs'
          New-Item -ItemType Directory -Path $inputs | Out-Null
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          $data = Join-Path $inputs 'windows-tcltk-9.0.4-data.zip'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare_windows_runtime_data.ps1 -Python $python -CacheRoot (Join-Path $inputs 'cache') -ScratchRoot (Join-Path $inputs 'extraction') -Output $data
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime data preparation failed' }
          & $python -B -m hatchling build -t wheel -d (Join-Path $inputs 'wheels')
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          $requirements = Join-Path $inputs 'requirements.txt'
          uv export --locked --no-dev --no-emit-project --no-header --output-file $requirements | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Hashed dependency export failed' }
          $wheel = @(Get-ChildItem -LiteralPath (Join-Path $inputs 'wheels') -Filter '*.whl')[0].FullName
          $archive = Join-Path $env:RUNNER_TEMP "Cytellect-$env:CI_VERSION-windows-x64.zip"
          & $python -B scripts/build_local_bundle.py --version $env:CI_VERSION --output $archive --runtime-data $data --wheel $wheel --requirements $requirements
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
          "CYTELLECT_CI_ZIP=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Fresh setup provisions Python and Fiji and records the cloud GPU setting
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'package-source'
          $install = Join-Path $env:RUNNER_TEMP 'installed-fresh'
          Expand-Archive -LiteralPath $env:CYTELLECT_CI_ZIP -DestinationPath $source
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "$source\scripts\local_setup.ps1" -SourceRoot $source -InstallRoot $install -Console -NoShortcut -CellposeRemoteUrl 'https://cellpose-ci.example' -CellposeRemoteToken 'ci-placeholder-key'
          if ($LASTEXITCODE -ne 0) { throw 'Fresh setup failed' }
          $marker = @(Get-ChildItem -LiteralPath "$install\apps" -Filter setup-complete.json -Recurse)
          if ($marker.Count -ne 1) { throw 'Expected one installed application' }
          $state = Get-Content -LiteralPath $marker[0].FullName -Raw | ConvertFrom-Json
          if (-not $state.cellpose_remote) { throw 'The cloud GPU setting was not recorded' }
          $saved = Get-Content -LiteralPath "$install\settings\cellpose-remote.json" -Raw | ConvertFrom-Json
          if ($saved.url -cne 'https://cellpose-ci.example' -or $saved.token -cne 'ci-placeholder-key') { throw 'Unexpected cloud GPU setting' }
          if ($state.workspace_retention -ne 'manual') { throw 'Default setup did not choose manual workspace retention' }
          $footprint = (Get-ChildItem -LiteralPath $install -Recurse -File -Force | Measure-Object -Property Length -Sum).Sum
          Write-Host ('Installed footprint: {0:N2} GB' -f ($footprint / 1GB))
          "CYTELLECT_FRESH_ROOT=$install" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CYTELLECT_FRESH_APP=$($state.app)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: The installed application selects the cloud GPU for Cellpose without contacting it
        shell: pwsh
        run: |
          $python = Join-Path $env:CYTELLECT_FRESH_APP '.venv\Scripts\python.exe'
          $code = "import json,os,sys; from pathlib import Path; from cytellect_api.local import local_cellpose_remote_environment as remote; os.environ.update(remote(Path(sys.argv[1]))); from cytellect_analysis.cellpose_engine import runtime_status; status=runtime_status(); print(json.dumps(status)); sys.exit(0 if status.get('available') and status.get('backend') == 'remote' else 1)"
          Push-Location $env:CYTELLECT_FRESH_APP
          try { & $python -B -c $code (Join-Path $env:CYTELLECT_FRESH_ROOT 'data') } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'The installed application does not select the cloud GPU' }
      - name: Update the published previous release that already holds a workspace
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP "Cytellect-$env:PREVIOUS_VERSION-windows-x64.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/genellect/cytellect/releases/download/v$env:PREVIOUS_VERSION/Cytellect-$env:PREVIOUS_VERSION-windows-x64.zip" -OutFile $previous
          if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PREVIOUS_SHA256) { throw 'Previous release hash mismatch' }
          $previousSource = Join-Path $env:RUNNER_TEMP 'previous-source'
          $root = Join-Path $env:RUNNER_TEMP 'installed-update'
          Expand-Archive -LiteralPath $previous -DestinationPath $previousSource
          $shell = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $shell -NoProfile -ExecutionPolicy Bypass -File "$previousSource\scripts\local_setup.ps1" -SourceRoot $previousSource -InstallRoot $root -Console -NoShortcut
          if ($LASTEXITCODE -ne 0) { throw 'Previous release setup failed' }
          $origin = 'http://127.0.0.1:8765'
          $headers = @{ Origin = $origin; 'X-Cytellect-Request' = '1' }
          function Start-Installed([string]$Version) {
            $apps = @(Get-ChildItem -LiteralPath "$root\apps" -Directory | Where-Object { $_.Name.StartsWith("$Version-") })
            if ($apps.Count -ne 1) { throw "Expected one installed $Version" }
            $marker = Get-Content -LiteralPath (Join-Path $apps[0].FullName 'setup-complete.json') -Raw | ConvertFrom-Json
            $python = Join-Path $marker.app '.venv\Scripts\python.exe'
            $arguments = @('-B', '-m', 'cytellect_api.local', '--data-dir', "`"$root\data`"", '--web-dir', "`"$($marker.app)\apps\web\out`"", '--fiji', "`"$($marker.fiji)`"", '--no-browser')
            $process = Start-Process -FilePath $python -ArgumentList $arguments -WorkingDirectory $marker.app -WindowStyle Hidden -PassThru
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($process.HasExited) { throw "$Version launcher exited early" }
              try { if ((Invoke-WebRequest -UseBasicParsing -Uri "$origin/v1/local/setup").StatusCode -eq 200) { return $process } } catch { Start-Sleep -Seconds 1 }
            }
            throw "$Version did not start"
          }
          function Stop-Installed($Process) {
            Stop-Process -Id $Process.Id
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if (-not (Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue)) { return }
              Start-Sleep -Milliseconds 500
            }
            throw 'Launcher kept listening after stop'
          }
          $process = Start-Installed $env:PREVIOUS_VERSION
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$origin/v1/local/session" -Headers $headers -WebSession $session | Out-Null
          $created = Invoke-RestMethod -Method Post -Uri "$origin/v1/workspaces" -Headers $headers -WebSession $session -ContentType 'application/json' -Body '{"title":"Update preservation check"}'
          Stop-Installed $process
          & $shell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\package-source\scripts\local_setup.ps1" -SourceRoot "$env:RUNNER_TEMP\package-source" -InstallRoot $root -Console -NoShortcut
          if ($LASTEXITCODE -ne 0) { throw 'Update over the previous release failed' }
          $process = Start-Installed $env:CI_VERSION
          try {
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$origin/v1/local/session" -Headers $headers -WebSession $session | Out-Null
            $kept = Invoke-RestMethod -Uri "$origin/v1/workspaces/$($created.id)" -Headers $headers -WebSession $session
            if ($kept.title -ne 'Update preservation check') { throw 'Workspace was not preserved across the update' }
            if ($null -ne $kept.expires) { throw 'Updated workspace still has a TTL deadline' }
            $status = Invoke-RestMethod -Uri "$origin/v1/local/setup"
            if (-not $status.ready) { throw 'Updated application is not ready' }
            if ($status.retention_mode -ne 'manual') { throw 'Update did not switch to manual workspace retention' }
          } finally { Stop-Installed $process }
  windows-installer:
    # Builds Cytellect-Setup-<version>.exe from this commit and installs, starts, re-runs,
    # interrupts, resumes, migrates, updates in the app (and rolls back) and uninstalls it on
    # a disposable runner (plan §7.1 T1/T4). Two versions of the same source test the update.
    # An integration test: main and manual runs only, like windows-installed.
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      CI_VERSION: 0.0.0-local.1
      UPDATE_VERSION: 0.0.0-local.2
      MIGRATE_VERSION: 0.1.0-local.20
      MIGRATE_SHA256: bcbefa59857b29c4221603045266b167fb7019311d512f1c475fbaef0608525a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --group build
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Build the setup ZIPs of two versions from this exact commit
        shell: pwsh
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'package-inputs'
          New-Item -ItemType Directory -Path $inputs | Out-Null
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          $data = Join-Path $inputs 'windows-tcltk-9.0.4-data.zip'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare_windows_runtime_data.ps1 -Python $python -CacheRoot (Join-Path $inputs 'cache') -ScratchRoot (Join-Path $inputs 'extraction') -Output $data
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime data preparation failed' }
          & $python -B -m hatchling build -t wheel -d (Join-Path $inputs 'wheels')
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          $requirements = Join-Path $inputs 'requirements.txt'
          uv export --locked --no-dev --no-emit-project --no-header --output-file $requirements | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Hashed dependency export failed' }
          $wheel = @(Get-ChildItem -LiteralPath (Join-Path $inputs 'wheels') -Filter '*.whl')[0].FullName
          foreach ($version in @($env:CI_VERSION, $env:UPDATE_VERSION)) {
            $archive = Join-Path $env:RUNNER_TEMP "zip\Cytellect-$version-windows-x64.zip"
            & $python -B scripts/build_local_bundle.py --version $version --output $archive --runtime-data $data --wheel $wheel --requirements $requirements
            if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
          }
      - name: Restore pinned public downloads (content-addressed, verified again on use)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/installer-cache
          key: windows-installer-${{ hashFiles('engines/fiji/runtime.lock.json', 'engines/python/windows-runtime.lock.json', 'scripts/local_setup.ps1', 'scripts/build_windows_installer.py') }}
      - name: Build the per-user installer with the pinned Inno Setup
        shell: pwsh
        run: |
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          $cache = Join-Path $env:RUNNER_TEMP 'installer-cache'
          $inno = Join-Path $env:RUNNER_TEMP 'inno'
          & $python -B scripts/build_windows_installer.py install-inno --dest $inno --cache $cache
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Inno Setup installation failed' }
          $output = Join-Path $env:RUNNER_TEMP 'installer'
          # The project environment has no pip; the runner's Python downloads the hash-locked wheels.
          $pip = (Get-Command python).Source
          foreach ($version in @($env:CI_VERSION, $env:UPDATE_VERSION)) {
            $work = Join-Path $env:RUNNER_TEMP "installer-work-$version"
            & $python -B scripts/build_windows_installer.py build --release-zip (Join-Path $env:RUNNER_TEMP "zip\Cytellect-$version-windows-x64.zip") --output-dir $output --work-dir $work --cache $cache --iscc (Join-Path $inno 'ISCC.exe') --pip-python $pip
            if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
            Write-Host ('Installer {0}: {1:N0} MB' -f $version, ((Get-Item -LiteralPath (Join-Path $output "Cytellect-Setup-$version.exe")).Length / 1MB))
            Remove-Item -LiteralPath $work -Recurse -Force
          }
          Get-Content -LiteralPath (Join-Path $output "Cytellect-Setup-$env:CI_VERSION.json") | Select-Object -First 16
          "CYTELLECT_CI_INSTALLER=$(Join-Path $output "Cytellect-Setup-$env:CI_VERSION.exe")" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CYTELLECT_UPDATE_INSTALLER=$(Join-Path $output "Cytellect-Setup-$env:UPDATE_VERSION.exe")" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Silent install, start, re-run, uninstall, resume, migrate from the published ZIP release and update in the app
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP "Cytellect-$env:MIGRATE_VERSION-windows-x64.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/genellect/cytellect/releases/download/v$env:MIGRATE_VERSION/Cytellect-$env:MIGRATE_VERSION-windows-x64.zip" -OutFile $previous
          if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MIGRATE_SHA256) { throw 'Previous release hash mismatch' }
          & ./packaging/windows/smoke.ps1 -Installer $env:CYTELLECT_CI_INSTALLER -Scratch (Join-Path $env:RUNNER_TEMP 'installer-smoke') -Version $env:CI_VERSION -Checkout (Get-Location).Path -PreviousZip $previous -UpdateInstaller $env:CYTELLECT_UPDATE_INSTALLER -UpdateVersion $env:UPDATE_VERSION
  windows-tests:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: windows-tests (${{ matrix.shard }}/4)
    runs-on: windows-latest
    # The full suite took 21-34 minutes in one job; each of four shards runs about a quarter of it.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14.8"}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --dev --python 3.14.8 --no-python-downloads
      - name: One shard of the Windows compatibility suite without a Python support override
        env:
          CYTELLECT_TEST_DATA_DIR: ${{ runner.temp }}/scientific-windows-data
        run: uv run --no-sync python -B -m pytest tests -m "not fiji" --shard=${{ matrix.shard }}/4 --basetemp="${{ runner.temp }}/scientific-windows-tests" --junitxml="${{ runner.temp }}/scientific-windows.xml" --scientific-collection="${{ runner.temp }}/scientific-windows-collection.json"
      - name: Keep only test identities, outcomes and timings
        if: always()
        run: uv run --no-sync python -B scripts/merge_test_shards.py strip --junit "${{ runner.temp }}/scientific-windows.xml" --collection "${{ runner.temp }}/scientific-windows-collection.json" --output-dir "${{ runner.temp }}/shard"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: error
          retention-days: 1
          # A re-run of a failed shard must replace that shard's earlier result, or the
          # aggregate below would combine the stale failure with the new attempts.
          overwrite: true
  python-windows-314:
    # Keeps the required-check and release-gate name: passes only when every shard passed and
    # the shards together are one full run of the Windows suite.
    needs: [changes, windows-tests]
    if: ${{ !cancelled() && needs.changes.outputs.windows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --dev
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-tests-*
          path: /tmp/windows-shards
      - name: Combine the shards into one run
        run: uv run python scripts/merge_test_shards.py merge --shards /tmp/windows-shards --output-junit /tmp/scientific-windows.xml --output-collection /tmp/scientific-windows-collection.json
      - name: Scoped compatibility receipt including failed and skipped cases
        run: uv run python scripts/scientific_review.py --junit /tmp/scientific-windows.xml --collection /tmp/scientific-windows-collection.json --output /tmp/cytellect-compliance/scientific-windows-receipt.json --source-commit "${{ github.sha }}"
      - name: Retain aggregate Windows compatibility evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-windows-314
          path: /tmp/cytellect-compliance/scientific-windows-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Every shard passed
        run: test "${{ needs.windows-tests.result }}" = success
