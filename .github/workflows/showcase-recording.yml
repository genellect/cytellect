name: Record public demo
on:
  workflow_dispatch:
    inputs:
      showcase_figures:
        description: "Also update figure prose, preserving identical published drawings"
        type: boolean
        default: true
      recording_run:
        description: "Resume figures from the showcase-presentation artifact of this workflow run"
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: public-demo-recording-${{ github.ref }}
  cancel-in-progress: false
jobs:
  showcase-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CYTELLECT_PROPOSAL_URL: ""
      CYTELLECT_PROPOSAL_TOKEN: ""
      CYTELLECT_CELLPOSE_REMOTE_URL: ""
      CYTELLECT_CELLPOSE_REMOTE_TOKEN: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: inputs.recording_run == ''
        with: {node-version: "24"}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: "3.12"}
      - run: npm install --global pnpm@11.19.0
        if: inputs.recording_run == ''
      - run: python -m pip install uv==0.12.2
      - run: uv sync --locked --dev
      - run: pnpm install --frozen-lockfile
        if: inputs.recording_run == ''
      - run: pnpm --dir services/showcase/pyodide install --frozen-lockfile
        if: inputs.recording_run == ''
      - run: pnpm --filter @cytellect/web exec playwright install --with-deps chromium
        if: inputs.recording_run == ''
      - run: bash scripts/install_figure_font.sh
      - name: Locate the installed Chromium
        if: inputs.recording_run == ''
        run: |
          task_browser=$(node -e 'console.log(require("./apps/web/node_modules/@playwright/test").chromium.executablePath())')
          echo "CYTELLECT_CHROMIUM_EXECUTABLE=$task_browser" >> "$GITHUB_ENV"
      - name: Keep the published drawings and provenance
        run: cp -a apps/web/public/showcase /tmp/cytellect-published
      - name: Download a completed recording stage
        if: inputs.recording_run != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: showcase-presentation
          run-id: ${{ inputs.recording_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/recorded-presentation
      - name: Restore the public recording without replacing the font registry
        if: inputs.recording_run != ''
        run: tar -xzf /tmp/recorded-presentation/showcase-presentation.tar.gz apps/web/public/showcase
      - name: Re-record presentation from the published seed
        if: inputs.recording_run == ''
        run: |
          uv run python -m cytellect_showcase.build \
            services/showcase/datasets/zenodo-6643470-oxaliplatin.json \
            services/showcase/datasets/zenodo-6643470-cisplatin.json \
            services/showcase/datasets/zenodo-6643470-nucleolar.json \
            services/showcase/datasets/cpg0016-jump-source13-plk1.json \
            --work /tmp/cytellect-showcase-presentation --cache /tmp/cytellect-showcase-cache \
            --fiji /tmp/recordings-only-no-fiji \
            --stages reseed,proposals,publish,snapshot,journal \
            --journal-keep '^(?!.*:(?:ai-|rank-))' \
            --journal-previous /tmp/cytellect-published/snapshot
      - name: Check the generated public tree
        if: inputs.recording_run == ''
        run: uv run python scripts/check_public_tree.py
      - name: Pack generated public assets
        if: inputs.recording_run == ''
        run: tar -czf /tmp/showcase-presentation.tar.gz apps/web/public/showcase fixtures/public/allowlist.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: inputs.recording_run == ''
        with:
          name: showcase-presentation
          path: /tmp/showcase-presentation.tar.gz
          retention-days: 7
      - name: Update figure prose with unchanged published drawings
        if: inputs.showcase_figures
        run: |
          uv run python -m cytellect_showcase.build \
            services/showcase/datasets/zenodo-6643470-oxaliplatin.json \
            services/showcase/datasets/zenodo-6643470-cisplatin.json \
            services/showcase/datasets/zenodo-6643470-nucleolar.json \
            services/showcase/datasets/cpg0016-jump-source13-plk1.json \
            --work /tmp/cytellect-showcase-presentation --cache /tmp/cytellect-showcase-cache \
            --fiji /tmp/recordings-only-no-fiji --stages reseed,figures \
            --figure-drawings /tmp/cytellect-published/snapshot
      - name: Pack completed figures
        if: inputs.showcase_figures
        run: |
          uv run python scripts/verify_showcase_update.py --before /tmp/cytellect-published --after apps/web/public/showcase
          uv run python scripts/check_public_tree.py
          tar -czf /tmp/showcase-presentation-complete.tar.gz apps/web/public/showcase fixtures/public/allowlist.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: inputs.showcase_figures
        with:
          name: showcase-presentation-complete
          path: /tmp/showcase-presentation-complete.tar.gz
          retention-days: 7
